<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Products</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
</head>

<body>

  <!-- HEADER (UNCHANGED) -->
  <header class="w-full">
    <div class="w-full bg-white">
      <div class="max-w-7xl mx-auto px-4 lg:px-8 h-20 flex items-center justify-between">
        <div class="flex items-center gap-3 md:w-1/6">
          <a href="#"><img src="/images/Zinckon-logo.png" class="h-14" /></a>
        </div>

        <div class="flex-1 max-w-2xl mx-6 hidden md:flex md:w-4/6">
          <div class="flex w-full border-2 border-[#8F267C] rounded-full overflow-hidden">
            <p class="p-4 bg-gray-100 text-sm border-r font-bold text-[#8F267C]">Products</p>
            <input type="text" placeholder="Type product names or CAS numbers..."
              class="flex-1 px-4 py-2 outline-none text-sm" />
            <button class="px-5 bg-[#8F267C] text-white">Search</button>
          </div>
        </div>

        <div class="flex items-center gap-4 text-sm md:w-1/6">
          <button class="relative">
            <span class="material-icons text-[#8F267C]">shopping_cart</span>
          </button>
        </div>
      </div>
    </div>

    <div class="w-full bg-[#8F267C] text-white">
      <div class="max-w-7xl mx-auto px-4 lg:px-8 h-12 flex items-center">
        <nav class="flex gap-10 text-sm font-medium">
          <a href="/index.html" class="font-bold">Home</a>
          <a href="/about.html" class="font-bold">About Us</a>
          <a href="/contact.html" class="font-bold">Contact Us</a>
          <a href="/products.html" class="font-bold underline">Our Products</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- CATEGORY SECTION -->
  <section class="max-w-7xl mx-auto px-6 py-16 space-y-24 overflow-x-hidden">
    <h3 class="text-4xl md:text-5xl font-extrabold text-[#8F267C] text-center mb-12">
      Product Categories
    </h3>

    <!-- DYNAMIC CONTENT -->
    <div id="categoryContainer" class="space-y-24"></div>
  </section>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    AOS.init({ duration: 1000, once: true });

    async function loadCategories() {
      const res = await fetch("/.netlify/functions/admin-get-categories");
      const categories = await res.json();

      const container = document.getElementById("categoryContainer");

      container.innerHTML = categories.map((cat, i) => {
        const reverse = i % 2 !== 0;

        return `
      <div class="flex flex-col ${reverse ? 'md:flex-row-reverse' : 'md:flex-row'}
                  items-center gap-10"
           data-aos="${reverse ? 'fade-left' : 'fade-right'}">

        <div class="md:w-1/2 h-[480px]">
          <img
            src="${cat.image_url || `/images/product-category/${cat.slug}.jpg`}"
            class="w-full h-full rounded-2xl shadow-xl transition-transform duration-500 hover:scale-105"
            alt="${cat.name}"
          />
        </div>

        <div class="md:w-1/2 space-y-4">
          <h2 class="text-3xl md:text-4xl font-bold text-[#8F267C]">
            ${cat.name}
          </h2>

          <p class="text-lg text-gray-700 leading-relaxed">
            ${cat.description || "More details coming soon."}
          </p>

          <a href="/products.html?category=${cat.slug}"
             class="inline-block bg-[#8F267C] text-white px-6 py-3 rounded-xl font-semibold hover:bg-[#6e1f5e] transition-all">
            View Products →
          </a>
        </div>
      </div>
    `;
      }).join("");

      AOS.refresh();
    }

    loadCategories();
  </script>

</body>

</html>
