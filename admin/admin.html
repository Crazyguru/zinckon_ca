<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login</title>
</head>

<body>
    <section class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="bg-white p-8 rounded shadow w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-[#8F267C]">
                Admin Login
            </h2>

            <input id="email" type="email" placeholder="Email" class="border p-3 w-full mb-4 rounded" />

            <input id="password" type="password" placeholder="Password" class="border p-3 w-full mb-4 rounded" />

            <button onclick="login()" class="w-full bg-[#8F267C] text-white py-3 rounded font-semibold">
                Login
            </button>

            <p id="error" class="text-red-600 text-sm mt-3 hidden"></p>
        </div>
    </section>
    <script>
        if (!localStorage.getItem("admin_token")) {
            window.location.href = "/index.html";
        }
        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const error = document.getElementById("error");

            error.classList.add("hidden");

            const res = await fetch("/.netlify/functions/admin-login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (!res.ok) {
                error.textContent = data.message || "Login failed";
                error.classList.remove("hidden");
                return;
            }

            localStorage.setItem("admin_token", data.token);
            window.location.href = "/admin.html";
        }
    </script>

</body>

</html>
