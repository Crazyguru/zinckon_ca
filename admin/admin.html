<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- LOGIN CARD -->
    <div class="bg-white p-8 rounded shadow w-96">
        <h1 class="text-2xl font-bold mb-6 text-center text-[#8F267C]">
            Admin Login
        </h1>
        <input id="email" type="email" placeholder="Email" class="border p-2 mb-2 w-full">
        <input id="password" type="password" placeholder="Password" class="border p-2 mb-4 w-full">

        <button onclick="login()" class="bg-[#8F267C] text-white px-6 py-2 rounded w-full">
            Login
        </button>

    </div>

    <!-- ✅ SCRIPT GOES HERE -->
    <script>
        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const res = await fetch("/.netlify/functions/admin-login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            if (res.ok) {
                sessionStorage.setItem("admin_logged_in", "true");

                // IMPORTANT: replace (kills back button access)
                window.location.replace("/admin/dashboard.html");
            } else {
                alert("Invalid login");
            }
        }

    </script>


</body>

</html>
