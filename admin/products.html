<!DOCTYPE html>
<html>

<head>
    <title>Admin – Products</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            margin: 6px 0;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            background: #8F267C;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .item {
            border-bottom: 1px solid #ddd;
            padding: 8px 0;
        }
    </style>
</head>

<body>
    <div id="products" class="grid grid-cols-3 gap-6"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const category = params.get("category");

        fetch(`/.netlify/functions/get-products-by-category?category=${category}`)
            .then(res => res.json())
            .then(data => {
                products.innerHTML = data.map(p => `
      <div class="border p-4 rounded">
        <img src="${p.image_url}" class="h-40 w-full object-cover">
        <h3 class="font-bold mt-2">${p.name}</h3>
        <p>${p.description || ""}</p>
        <p class="font-semibold">₹${p.price}</p>
        <button onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
    `).join("");
            });
    </script>


</body>

</html>
