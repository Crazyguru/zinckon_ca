<!DOCTYPE html>
<html>

<head>
    <title>Admin – Products</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            margin: 6px 0;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            background: #8F267C;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .item {
            border-bottom: 1px solid #ddd;
            padding: 8px 0;
        }
    </style>
</head>

<body>

    <h1>Admin – Products</h1>

    <input id="name" placeholder="Name">
    <input id="price" placeholder="Price">
    <input id="image" placeholder="Image URL">
    <textarea id="desc" placeholder="Description"></textarea>
    <select id="cat"></select>
    <button onclick="add()">Add Product</button>

    <div id="list"></div>

    <script>
        async function loadCats() {
            const r = await fetch("/.netlify/functions/admin-get-categories");
            const d = await r.json();
            cat.innerHTML = d.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
        }

        async function loadProducts() {
            const r = await fetch("/.netlify/functions/admin-get-products");
            const d = await r.json();
            list.innerHTML = d.map(p => `<p>${p.name} – ${p.category}</p>`).join("");
        }

        async function add() {
            await fetch("/.netlify/functions/admin-add-product", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name.value,
                    description: desc.value,
                    price: price.value,
                    image_url: image.value,
                    category_id: cat.value
                })
            });
            loadProducts();
        }

        loadCats();
        loadProducts();
    </script>

</body>

</html>
