<!DOCTYPE html>
<html>

<head>
    <title>Admin – Categories</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        input,
        textarea {
            width: 100%;
            margin: 6px 0;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            background: #8F267C;
            color: #fff;
            border: none;
        }

        .category {
            border-bottom: 1px solid #ddd;
            padding: 8px 0;
        }
    </style>
</head>

<body>

    <h1>Admin – Product Categories</h1>

    <h2>Add Category</h2>
    <input id="name" placeholder="Category Name">
    <input id="slug" placeholder="Slug (e.g. pharmaceuticals)">
    <textarea id="description" placeholder="Description"></textarea>
    <input id="image" placeholder="Image URL (/images/...)">
    <button onclick="addCategory()">Add</button>

    <h2>Existing Categories</h2>
    <div id="categories"></div>

    <script>
        async function loadCategories() {
            const res = await fetch("/.netlify/functions/admin-get-categories");
            const data = await res.json();

            const container = document.getElementById("categories");
            container.innerHTML = "";

            data.forEach(c => {
                container.innerHTML += `
      <div class="category">
        <strong>${c.name}</strong> (${c.slug})<br>
        ${c.description || ""}
      </div>
    `;
            });
        }

        async function addCategory() {
            const payload = {
                name: name.value,
                slug: slug.value,
                description: description.value,
                image_url: image.value
            };

            await fetch("/.netlify/functions/admin-add-category", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            loadCategories();
        }

        loadCategories();
    </script>

</body>

</html>
