<!DOCTYPE html>
<html>

<body>

    <h2>Admin – Categories</h2>

    <input id="name" placeholder="Name">
    <input id="slug" placeholder="Slug">
    <textarea id="desc" placeholder="Description"></textarea>
    <button onclick="add()">Add Category</button>

    <hr>
    <div id="list"></div>

    <script>
        async function load() {
            const res = await fetch("/.netlify/functions/admin-get-categories");
            const data = await res.json();
            list.innerHTML = data.map(c =>
                `<p>${c.name} (${c.slug})</p>`
            ).join("");
        }

        async function add() {
            await fetch("/.netlify/functions/admin-add-category", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name.value,
                    slug: slug.value,
                    description: desc.value
                })
            });
            load();
        }

        load();
    </script>

</body>

</html>
