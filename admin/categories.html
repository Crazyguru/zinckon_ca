<!DOCTYPE html>
<html>

<head>
    <title>Admin – Categories</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        input,
        textarea {
            width: 100%;
            margin: 6px 0;
            padding: 8px;
        }

        button {
            padding: 8px 16px;
            background: #8F267C;
            color: #fff;
            border: none;
        }

        .category {
            border-bottom: 1px solid #ddd;
            padding: 8px 0;
        }
    </style>
</head>

<body>
    <h1>Admin – Categories</h1>

    <input id="name" placeholder="Name">
    <input id="slug" placeholder="Slug">
    <textarea id="desc" placeholder="Description"></textarea>
    <button onclick="add()">Add</button>

    <div id="list"></div>

    <script>
        async function load() {
            const r = await fetch("/.netlify/functions/admin-get-categories");
            const d = await r.json();
            list.innerHTML = d.map(c => `<p>${c.name} (${c.slug})</p>`).join("");
        }

        async function add() {
            await fetch("/.netlify/functions/admin-add-category", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name.value,
                    slug: slug.value,
                    description: desc.value
                })
            });
            load();
        }

        load();
    </script>


</body>

</html>
