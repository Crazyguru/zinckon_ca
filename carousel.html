<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Modern Tailwind Carousel</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-neutral-900 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-5xl overflow-hidden">
      <div
        id="carousel"
        class="flex items-center gap-10 transition-transform duration-700 ease-in-out"
      >
        <img
          src="https://picsum.photos/id/1015/600/400"
          class="carousel-img w-72 h-48 object-cover rounded-2xl transition-all duration-700 ease-in-out opacity-40 scale-75 blur-sm"
        />

        <img
          src="https://picsum.photos/id/1016/600/400"
          class="carousel-img w-72 h-48 object-cover rounded-2xl transition-all duration-700 ease-in-out opacity-40 scale-75 blur-sm"
        />

        <img
          src="https://picsum.photos/id/1018/600/400"
          class="carousel-img w-72 h-48 object-cover rounded-2xl transition-all duration-700 ease-in-out opacity-40 scale-75 blur-sm"
        />

        <img
          src="https://picsum.photos/id/1020/600/400"
          class="carousel-img w-72 h-48 object-cover rounded-2xl transition-all duration-700 ease-in-out opacity-40 scale-75 blur-sm"
        />

        <img
          src="https://picsum.photos/id/1024/600/400"
          class="carousel-img w-72 h-48 object-cover rounded-2xl transition-all duration-700 ease-in-out opacity-40 scale-75 blur-sm"
        />
      </div>
    </div>

    <script>
      const carousel = document.getElementById("carousel");
      const images = document.querySelectorAll(".carousel-img");
      let index = 0;

      function updateCarousel() {
        images.forEach((img) => {
          img.classList.remove("opacity-100", "scale-100", "blur-0");
          img.classList.add("opacity-40", "scale-75", "blur-sm");
        });

        images[index].classList.add("opacity-100", "scale-100", "blur-0");

        const containerWidth = carousel.parentElement.offsetWidth;
        const imageWidth = 288;
        const gap = 40;

        const offset =
          index * (imageWidth + gap) - (containerWidth / 2 - imageWidth / 2);
        carousel.style.transform = `translateX(-${offset}px)`;
      }

      updateCarousel();

      setInterval(() => {
        index = (index + 1) % images.length;
        updateCarousel();
      }, 2500);
    </script>
  </body>
</html>
