<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3-Card Per Slide</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>

<body class="bg-gray-100 p-10">

    <div class="swiper mySwiper">
        <div class="swiper-wrapper">

            <!-- Slide 1 (3 objects) -->
            <div class="swiper-slide grid grid-cols-3 gap-5">

                <!-- Card 1 -->
                <div class="bg-white shadow rounded-xl p-4 h-96 flex flex-col justify-between">
                    <img src="https://via.placeholder.com/150" class="h-28 object-contain mx-auto" />
                    <h3 class="text-center font-semibold">Product 1</h3>
                </div>

                <!-- Card 2 -->
                <div class="bg-white shadow rounded-xl p-4 h-96 flex flex-col justify-between">
                    <img src="https://via.placeholder.com/150" class="h-28 object-contain mx-auto" />
                    <h3 class="text-center font-semibold">Product 2</h3>
                </div>

                <!-- Card 3 -->
                <div class="bg-white shadow rounded-xl p-4 h-96 flex flex-col justify-between">
                    <img src="https://via.placeholder.com/150" class="h-28 object-contain mx-auto" />
                    <h3 class="text-center font-semibold">Product 3</h3>
                </div>

            </div>

            <!-- Slide 2 (3 objects) -->
            <div class="swiper-slide grid grid-cols-3 gap-5">

                <div class="bg-white shadow rounded-xl p-4 h-96 flex flex-col justify-between">
                    <img src="https://via.placeholder.com/150" class="h-28 object-contain mx-auto" />
                    <h3 class="text-center font-semibold">Product 4</h3>
                </div>

                <div class="bg-white shadow rounded-xl p-4 h-96 flex flex-col justify-between">
                    <img src="https://via.placeholder.com/150" class="h-28 object-contain mx-auto" />
                    <h3 class="text-center font-semibold">Product 5</h3>
                </div>

                <div class="bg-white shadow rounded-xl p-4 h-96 flex flex-col justify-between">
                    <img src="https://via.placeholder.com/150" class="h-28 object-contain mx-auto" />
                    <h3 class="text-center font-semibold">Product 6</h3>
                </div>

            </div>

            <!-- Slide 3 (3 objects) -->
            <div class="swiper-slide grid grid-cols-3 gap-5">

                <div class="bg-white shadow rounded-xl p-4 h-96 flex flex-col justify-between">
                    <img src="https://via.placeholder.com/150" class="h-28 object-contain mx-auto" />
                    <h3 class="text-center font-semibold">Product 7</h3>
                </div>

                <div class="bg-white shadow rounded-xl p-4 h-96 flex flex-col justify-between">
                    <img src="https://via.placeholder.com/150" class="h-28 object-contain mx-auto" />
                    <h3 class="text-center font-semibold">Product 8</h3>
                </div>

                <div class="bg-white shadow rounded-xl p-4 h-96 flex flex-col justify-between">
                    <img src="https://via.placeholder.com/150" class="h-28 object-contain mx-auto" />
                    <h3 class="text-center font-semibold">Product 9</h3>
                </div>

            </div>

        </div>

        <!-- Dots -->
        <!-- <div class="swiper-pagination mt-5"></div> -->
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper(".mySwiper", {
            loop: true,
            autoplay: {
                delay: 2500,
                disableOnInteraction: false,
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
        });
    </script>

</body>

</html>
