<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>

  <body>
    <!-- HEADER UNCHANGED -->
    <header class="w-full">
      <!-- TOP BAR -->
      <div
        class="max-w-7xl mx-auto px-4 lg:px-8 h-20 flex items-center justify-between"
      >
        <!-- Logo -->
        <div class="flex items-center gap-3 md:w-1/6">
          <a href="/index.html"
            ><img
              src="/images/Zinckon-logo.png"
              alt="Zinckon+"
              class="h-14 w-auto"
          /></a>
        </div>

        <!-- Search Bar -->
        <div class="flex-1 max-w-2xl mx-6 hidden md:flex md:w-4/6">
          <div
            class="flex w-full border-2 border-[#8F267C] rounded-full overflow-hidden"
          >
            <p
              class="p-4 bg-gray-100 text-sm outline-none border-r border-gray-300 font-bold text-[#8F267C]"
            >
              Products
            </p>
            <input
              type="text"
              placeholder="Type product names or CAS numbers..."
              class="flex-1 px-4 py-2 outline-none text-sm"
            />
            <button
              class="px-5 bg-[#8F267C] text-white flex items-center justify-center"
            >
              <span class="material-icons">search</span>
            </button>
          </div>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center gap-4 text-sm md:w-1/6">
          <!-- <div class="flex items-center gap-1 cursor-pointer">
              <span>CA</span> | <span class="text-gray-500">EN</span>
            </div> -->
          <button class="relative">
            <span class="material-icons text-[#8F267C]">shopping_cart</span
            ><span
              class="absolute -top-1 -right-2 text-xs bg-[#8F267C] text-white rounded-full px-1"
              >0</span
            >
          </button>
          <div class="relative group">
            <button class="flex items-center text-[#8F267C] gap-1">
              Login
            </button>
            <div
              class="hidden absolute right-0 mt-2 w-32 bg-white shadow rounded-md border border-gray-100 text-gray-700 text-sm p-2"
            >
              <a class="block px-2 py-1 hover:bg-gray-100 cursor-pointer"
                >Sign In</a
              >
              <a class="block px-2 py-1 hover:bg-gray-100 cursor-pointer"
                >Register</a
              >
            </div>
          </div>
        </div>
      </div>

      <!-- PURPLE NAV STRIP -->
      <div class="w-full bg-[#8F267C] text-white">
        <div
          class="max-w-7xl mx-auto px-4 lg:px-8 h-12 flex items-center justify-between"
        >
          <nav class="flex items-center gap-10 text-sm font-medium relative">
            <a class="font-bold hover:underline" href="/index.html">Home</a>

            <!-- Industry Dropdown -->
            <div class="group relative">
              <button class="font-bold hover:underline">Applications</button>

              <!-- Dropdown -->
              <div
                class="absolute left-0 mt-2 hidden group-hover:block bg-white text-[#8F267C] shadow-lg rounded-lg py-2 w-48 z-50"
              >
                <a href="#" class="block px-4 py-2 hover:bg-gray-100"
                  >Pharmaceuticals</a
                >
                <a href="#" class="block px-4 py-2 hover:bg-gray-100"
                  >Nutraceuticals</a
                >
                <a href="#" class="block px-4 py-2 hover:bg-gray-100"
                  >Beverages</a
                >
                <a href="#" class="block px-4 py-2 hover:bg-gray-100"
                  >Cosmetics</a
                >
              </div>
            </div>
            <!-- Products Dropdown -->
            <!-- <div class="group relative">
              <button class="hover:underline">Our Products</button>

              <div
                class="absolute left-0 mt-2 hidden group-hover:block bg-white text-[#8F267C] shadow-lg rounded-lg py-2 w-48 z-50">
                <a href="#" class="block px-4 py-2 hover:bg-gray-100">Zinc</a>
                <a href="#" class="block px-4 py-2 hover:bg-gray-100">Magnesium</a>
                <a href="#" class="block px-4 py-2 hover:bg-gray-100">Iron</a>
                <a href="#" class="block px-4 py-2 hover:bg-gray-100">Calcium</a>
              </div>
            </div> -->

            <!-- Simple Links -->

            <a href="/about.html" class="font-bold hover:underline">About Us</a>
            <a href="/contact.html" class="font-bold hover:underline"
              >Contact Us</a
            >
            <a href="/products.html" class="font-bold hover:underline"
              >Our Products</a
            >
          </nav>

          <!-- <button class="px-4 py-2 bg-white text-[#8F267C] font-semibold rounded-md text-sm">
            Request a QUOTE
          </button> -->
        </div>
      </div>
    </header>

    <!-- HERO SECTION -->
    <section
      class="relative h-[calc(100vh-128px)] w-[100vw] left-1/2 -translate-x-1/2 overflow-x-hidden bg-black"
    >
      <!-- SLIDES -->
      <div class="absolute inset-0">
        <div
          class="hero-slide absolute inset-0 opacity-100 transition-opacity duration-700"
        >
          <img
            src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e"
            class="w-full h-full object-cover"
          />
        </div>

        <div
          class="hero-slide absolute inset-0 opacity-0 transition-opacity duration-700"
        >
          <img
            src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb"
            class="w-full h-full object-cover"
          />
        </div>

        <div
          class="hero-slide absolute inset-0 opacity-0 transition-opacity duration-700"
        >
          <img
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330"
            class="w-full h-full object-cover"
          />
        </div>
      </div>

      <!-- OVERLAY -->
      <div
        class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/40 to-transparent"
      ></div>

      <!-- TEXT -->
      <div
        class="absolute left-16 top-1/2 -translate-y-1/2 max-w-xl text-white z-10"
      >
        <h1 class="text-6xl font-bold mb-6">Portraits</h1>
        <p class="text-gray-200 mb-8 leading-relaxed">
          Lorem ipsum dolor sit amet consectetur. Feugiat aliquam praesent
          tellus suspendisse urna.
        </p>
        <a href="#products">
          <button
            class="border border-white px-6 py-2 hover:bg-white hover:text-black transition"
          >
            Explore
          </button>
        </a>
      </div>

      <!-- THUMBNAILS -->
      <div class="absolute right-16 bottom-24 flex items-end gap-6 z-10">
        <img
          src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e"
          class="hero-thumb w-48 h-40 object-cover rounded-2xl ring-4 ring-white opacity-100 scale-100 -translate-y-3 transition-all duration-500"
        />
        <img
          src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb"
          class="hero-thumb w-40 h-32 object-cover rounded-2xl opacity-70 scale-90 transition-all duration-500"
        />
        <img
          src="https://images.unsplash.com/photo-1494790108377-be9c29b29330"
          class="hero-thumb w-40 h-32 object-cover rounded-2xl opacity-70 scale-90 transition-all duration-500"
        />
      </div>

      <!-- DOTS -->
      <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex gap-3 z-10">
        <span class="hero-dot w-2 h-2 rounded-full bg-white"></span>
        <span class="hero-dot w-2 h-2 rounded-full bg-white/40"></span>
        <span class="hero-dot w-2 h-2 rounded-full bg-white/40"></span>
      </div>

      <!-- SCRIPT -->
      <script>
        (() => {
          const section = document.currentScript.closest("section");
          const slides = section.querySelectorAll(".hero-slide");
          const dots = section.querySelectorAll(".hero-dot");
          const thumbs = section.querySelectorAll(".hero-thumb");
          let index = 0;

          setInterval(() => {
            slides.forEach((s) =>
              s.classList.replace("opacity-100", "opacity-0")
            );
            dots.forEach((d) => d.classList.replace("bg-white", "bg-white/40"));

            thumbs.forEach((t) => {
              t.classList.remove(
                "w-48",
                "h-40",
                "opacity-100",
                "scale-100",
                "ring-4",
                "ring-white",
                "-translate-y-3"
              );
              t.classList.add("w-40", "h-32", "opacity-70", "scale-90");
            });

            index = (index + 1) % slides.length;

            slides[index].classList.replace("opacity-0", "opacity-100");
            dots[index].classList.replace("bg-white/40", "bg-white");

            thumbs[index].classList.remove(
              "w-40",
              "h-32",
              "opacity-70",
              "scale-90"
            );
            thumbs[index].classList.add(
              "w-48",
              "h-40",
              "opacity-100",
              "scale-100",
              "ring-4",
              "ring-white",
              "-translate-y-3"
            );
          }, 3500);
        })();
      </script>
    </section>

    <!-- <section id="products" class="h-[500px] w-auto overflow-x-hidden"></section> -->

    <script src="/script.js"></script>
  </body>
</html>
